<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArborForm Quiz</title>

    <!-- font awesome cdn link  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- custom css file link  -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
<!-- header section starts  -->
<div id="header-placeholder"></div>
<!-- header section ends -->

<section class="heading">
    <h3>
        <span class="brand">Arbor</span><span class="brandB">Form</span>
        <span class="brand">Quiz</span>
    </h3>
    <p>
        <span id="typed"></span>
    <p>
    <!-- Script for typing text -->
    <script>
        const text = "Take part in our quiz to learn something new with more releases coming soon.\
        Our quiz is designed to have no prior knowledge for connection design to be completed";
        const typingElement = document.getElementById("typed");

        let index = 0;

        function type() {
        if (index < text.length) {
            typingElement.textContent += text[index];
            index++;
            setTimeout(type, 20);
        }
        }

        type();
    </script>
    <div class="breadcrumb">
        <a href="Apps.html"> Apps </a> 
        <span> / Quiz </span>
    </div>
</section>
<!-- course-3 section starts  -->

<section class="course-4">
    <div class="quiz-container">
        <iframe class="quiz-desktop"
            loading="lazy" style="border:none;"
            src="https://www.canva.com/design/DAG_oCt9NxY/oCKBNt_sm6oycuMo41OO6A/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>

        <!-- Mobile version -->
        <iframe class="quiz-mobile"
            loading="lazy" style="border:none;"
            src="https://www.canva.com/design/DAHBBOBWQow/SuS-U39XHkdnaZ9YTBDtHw/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>
    
</section>

<section class="course-4">
    <div>
        <h2>
            About The quiz
        </h2>
        <p>
            Written by MVP, this quiz is an informative and requires no prioir knowledge to construction, 
            all information is protected and rights reserved under ACT 1995 
        </p>
    </div>
</section>

<!-- course-3 section ends -->

<!-- footer section starts  -->

<div id="footer-placeholder"></div>
    <script>
        fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>

<!-- footer section ends -->

<!-- custom js file link  -->
<script src="js/script.js"></script>
<script src="js/header.js"></script>
</body>
</html>
