<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArborForm Quiz</title>

    <!-- font awesome cdn link  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- custom css file link  -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
<!-- header section starts  -->
<div id="header-placeholder"></div>
<script>
fetch("header.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("header-placeholder").innerHTML = data;

    const menuBtn = document.getElementById('menu-btn');
    const navbar = document.querySelector('.header .navbar');

    if (menuBtn && navbar) {
        menuBtn.addEventListener('click', () => {
            navbar.classList.toggle('active');
        });
    }
});
</script>
<!-- header section ends -->

<section class="heading">
    <h3>ArborForm Quiz</h3>
    <p>Take part in our quiz to learn something new</p>
</section>

<section>
    <a href="about.html"> About us </a> <span> / Quiz </span>
</section>

<!-- course-3 section starts  -->
<section class="course-4">
    <div class="quiz-container">
        <iframe class="quiz-desktop"
            loading="lazy" style="border:none;"
            src="https://www.canva.com/design/DAG_oCt9NxY/oCKBNt_sm6oycuMo41OO6A/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>

        <!-- Mobile version -->
        <iframe class="quiz-mobile"
            loading="lazy" style="border:none;"
            src="https://www.canva.com/design/DAHBBOBWQow/SuS-U39XHkdnaZ9YTBDtHw/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>
</section>

<!-- course-3 section ends -->

<!-- footer section starts  -->

<div id="footer-placeholder"></div>
    <script>
        fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>

<!-- footer section ends -->

<!-- custom js file link  -->
<script src="js/script.js"></script>

</body>
</html>
