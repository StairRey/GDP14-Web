<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebXR Test - Simple Version</title>
    
    <!-- ONLY A-Frame needed - WebXR is built into it! -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        /* Start AR Button */
        .start-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #667eea;
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .start-button:hover {
            background: #5568d3;
        }
        
        .start-button.hidden {
            display: none;
        }
        
        /* Instructions */
        .instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 20px;
            z-index: 1000;
            text-align: center;
            max-width: 300px;
        }
        
        .instructions.hidden {
            display: none;
        }
        
        /* Crosshair for placement */
        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(102, 126, 234, 0.8);
            border-radius: 50%;
            z-index: 500;
            pointer-events: none;
        }
        
        .crosshair.hidden {
            display: none;
        }
        
        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(102, 126, 234, 0.8);
        }
        
        .crosshair::before {
            top: 50%;
            left: 20%;
            width: 60%;
            height: 3px;
            transform: translateY(-50%);
        }
        
        .crosshair::after {
            left: 50%;
            top: 20%;
            height: 60%;
            width: 3px;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    
    <!-- Start AR Button -->
    <button class="start-button" id="startButton">
        📱 Start AR
    </button>
    
    <!-- Instructions (shown after starting AR) -->
    <div class="instructions hidden" id="instructions">
        <p id="instructionText">Point at the ground and tap to place the box</p>
    </div>
    
    <!-- Crosshair (shown during placement) -->
    <div class="crosshair hidden" id="crosshair"></div>

    <!-- A-Frame Scene -->
    <a-scene
        webxr="requiredFeatures: hit-test,local-floor;"
        vr-mode-ui="enabled: false">
        
        <!-- Camera -->
        <a-entity id="camera" camera position="0 1.6 0"></a-entity>
        
        <!-- The red box (starts invisible) -->
        <a-box 
            id="redBox"
            position="0 0.5 0" 
            material="color: red;"
            visible="false">
        </a-box>
        
        <!-- Optional: Add text label -->
        <a-text 
            id="label"
            value="Red Box in AR!" 
            position="0 1.2 0" 
            align="center" 
            color="white"
            scale="2 2 2"
            visible="false">
        </a-text>
        
    </a-scene>

    <script>
        /*
         * STEP-BY-STEP EXPLANATION:
         * 
         * 1. User clicks "Start AR" button
         * 2. WebXR AR session starts (camera opens)
         * 3. User points camera at ground
         * 4. User taps screen
         * 5. Box appears at that location
         * 6. Box stays there even when user moves!
         */
        
        // Variables
        let isPlaced = false;
        const redBox = document.getElementById('redBox');
        const label = document.getElementById('label');
        const camera = document.getElementById('camera');
        
        // Step 1: Start AR when button clicked
        document.getElementById('startButton').addEventListener('click', function() {
            console.log('Starting AR...');
            
            // Hide button
            this.classList.add('hidden');
            
            // Show instructions and crosshair
            document.getElementById('instructions').classList.remove('hidden');
            document.getElementById('crosshair').classList.remove('hidden');
            
            // Enter WebXR AR mode
            const scene = document.querySelector('a-scene');
            scene.enterVR();
            
            console.log('✅ AR started! Point at ground and tap to place.');
        });
        
        // Step 2: Listen for tap to place box
        window.addEventListener('click', function placeBox(event) {
            // Don't place if already placed
            if (isPlaced) return;
            
            console.log('Placing box...');
            
            // Make box visible
            redBox.setAttribute('visible', true);
            label.setAttribute('visible', true);
            
            // Get camera position
            const cameraPosition = camera.object3D.position;
            const cameraRotation = camera.object3D.rotation;
            
            // Place box 2 meters in front of camera, on the ground
            const distance = 2;
            const x = cameraPosition.x - Math.sin(cameraRotation.y) * distance;
            const z = cameraPosition.z - Math.cos(cameraRotation.y) * distance;
            
            redBox.object3D.position.set(x, 0.5, z);
            label.object3D.position.set(x, 1.2, z);
            
            // Rotate to face camera
            redBox.object3D.rotation.y = cameraRotation.y;
            label.object3D.rotation.y = cameraRotation.y;
            
            isPlaced = true;
            
            // Update UI
            document.getElementById('instructionText').textContent = '✅ Box placed! Walk around it!';
            document.getElementById('crosshair').classList.add('hidden');
            
            // Vibrate if supported
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
            
            console.log('✅ Box placed at:', x, 0.5, z);
            console.log('🚶 You can now walk around the box!');
            
            // Remove this listener so we don't place again
            window.removeEventListener('click', placeBox);
        });
        
        console.log('📱 WebXR Test Ready');
        console.log('👉 Click "Start AR" to begin');
    </script>
</body>
</html>
